version: 1
# Six complementary bounded requests. Order is priority if a smaller cap is used.
# Broad discovery is never required to mention a behavioral/economic domain.
# Relevance ranks text matches, not embeddings; newest-first is a separate slice.
queries:
  - name: broad_ai_ml
    kind: semantic
    terms: "{keywords}"
  - name: newest_ai_ml
    kind: recent
    terms: "{keywords}"
  - name: behavioral_economic_transfer
    kind: semantic
    scope: cross_domain
    terms: "({keywords}) AND ({domains})"
  # Human-impact papers may say generative AI rather than name an ML method.
  - name: ai_behavior_and_economy
    kind: semantic
    scope: cross_domain
    terms: '("artificial intelligence" OR "generative AI") AND (incentives OR trust OR labor OR productivity OR adoption)'
  - name: methods_and_evaluation
    kind: semantic
    terms: '({keywords}) AND (robustness OR uncertainty OR evaluation OR efficiency)'
  # Transferable mechanisms/identification methods, not just domain vocabulary.
  - name: causal_and_strategic_mechanisms
    kind: semantic
    terms: '({keywords}) AND (causality OR "mechanism design" OR "decision theory")'
