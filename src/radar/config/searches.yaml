version: 3
# Adaptive discovery policy: learning goals are hypotheses, not truth or
# mastery claims. The model planner chooses actual questions, wording,
# retrieval methods, dates and followups within the budgets below.
# No query strings live here: role reservations describe retrieval purpose,
# never fixed queries. Initial wave <= 6 queries, followup wave <= 6
# queries, each query <= 15 results. Planner deadline 120s, output cap 3000
# tokens. Broad AI/ML center with behavioral/economic cross-domain lenses.
learning_goals:
  - id: learning_and_generalization
    question: >-
      Which mechanisms explain generalization and emergent capabilities,
      and which apparent advances are artifacts of data, scale or evaluation?
    scope: broad
  - id: uncertainty_and_identification
    question: >-
      When can AI systems support reliable inference under limited data,
      distribution shift and unobserved confounding?
    scope: broad
  - id: objectives_and_incentives
    scope: cross_domain
    question: >-
      How do optimization targets and strategic incentives shape AI behavior,
      and when do economic mechanisms transfer to alignment or evaluation?
  - id: measurement_and_human_ai
    scope: cross_domain
    question: >-
      What do AI evaluations measure, and which causal mechanisms explain
      changes in human learning, decisions and economic productivity?
initial_queries: 6
followup_queries: 6
results_per_query: 15
planning_timeout_s: 120
planner_max_tokens: 3000
